apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: context-alarm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/context-alarm/context-alarm-backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: api-secret
          ports:
            - containerPort: 8080
