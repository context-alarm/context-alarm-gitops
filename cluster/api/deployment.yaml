apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: context-alarm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        reloader.stakater.com/auto: "true"
        secret.reloader.stakater.com/reload: "api-secret"
    spec:
      imagePullSecrets:
        - name: ghcr-cred
      containers:
        - name: api
          image: ghcr.io/context-alarm/context-alarm-backend:2329512cc505d9616ef6ef6fc8654ad5d850e398
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: api-secret
          ports:
            - containerPort: 9090
