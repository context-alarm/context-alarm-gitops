apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: context-alarm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-cred
      containers:
        - name: api
          image: ghcr.io/context-alarm/context-alarm-backend:1febed56be4ff80b92614136396ca2fdc4ad6cfc
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: api-secret
          ports:
            - containerPort: 8080
