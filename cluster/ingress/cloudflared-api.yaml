apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-api
  namespace: context-alarm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-api
  template:
    metadata:
      labels:
        app: cloudflared-api
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - context-alarm-api
            - --url=http://api.context-alarm.svc.cluster.local:80
          volumeMounts:
            - name: tunnel-cred
              mountPath: /etc/cloudflared
              readOnly: true
      volumes:
        - name: tunnel-cred
          secret:
            secretName: cloudflared-tunnel-cred
