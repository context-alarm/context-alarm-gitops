apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-api
  namespace: context-alarm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-api
  template:
    metadata:
      labels:
        app: cloudflared-api
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: token

