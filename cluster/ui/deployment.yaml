apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: context-alarm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
      annotations:
        context-alarm.dev/dummy-rollout: "2026-03-18T00:00:00Z"
    spec:
      imagePullSecrets:
        - name: ghcr-cred
      containers:
        - name: ui
          image: ghcr.io/context-alarm/context-alarm-front-end:d7ccdf42d7c142d2e7c72f138ab8a9c580f7e8ff
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
