apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: context-alarm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
      annotations:
        context-alarm.dev/dummy-rollout: "2026-03-18T00:00:00Z"
    spec:
      imagePullSecrets:
        - name: ghcr-cred
      containers:
        - name: ui
          image: ghcr.io/context-alarm/context-alarm-front-end:8e1de93395fcbe7110271531a3a589b28b6f1f8e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
